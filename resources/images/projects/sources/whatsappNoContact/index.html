<!doctype html>
<!--
  Source of the portfolio image resources/images/projects/whatsappNoContact.webp.
  Re-render it with:
    bun scripts/captureProjectImage.js --page resources/images/projects/sources/whatsappNoContact/ --out resources/images/projects/whatsappNoContact.webp --width 1280 --height 800 --quality 80
  screenshot.webp comes from the page itself, with a fake number in the URL so the form is filled in:
    bun scripts/captureProjectImage.js --page "web-projects/whatsapp-no-contact/?p=34600000000" --out resources/images/projects/sources/whatsappNoContact/screenshot.webp --width 520 --height 560 --quality 90 --wait 1500
  The chat on the right is drawn here, because the real chat opens in WhatsApp, outside the page.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WhatsApp Without Saving a Contact portfolio image</title>
    <style>
      @font-face {
        font-family: "Inter";
        src: url("../../../../fonts/InterVariable.woff2") format("woff2");
        font-weight: 100 900;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1280px;
        height: 800px;
        overflow: hidden;
      }
      body {
        position: relative;
        font-family: "Inter", "Segoe UI", sans-serif;
        color: #f3f6f4;
        background:
          radial-gradient(circle at 88% 12%, rgba(37, 211, 102, 0.22), transparent 42%),
          radial-gradient(circle at 4% 100%, rgba(18, 140, 126, 0.26), transparent 45%),
          #071410;
      }
      .caption {
        position: absolute;
        left: 88px;
        top: 100px;
        width: 560px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 20px;
        font-weight: 600;
        color: #93a8a1;
      }
      .brand::before {
        content: "";
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #25d366;
        box-shadow: 0 0 0 5px rgba(37, 211, 102, 0.28);
      }
      h1 {
        margin-top: 20px;
        font-size: 64px;
        line-height: 1.04;
        font-weight: 800;
        letter-spacing: -1.8px;
      }
      .accent {
        color: #4ceb87;
      }
      .steps {
        list-style: none;
        padding: 0;
        margin-top: 44px;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }
      .steps li {
        display: flex;
        align-items: center;
        gap: 20px;
        font-size: 28px;
        font-weight: 600;
        color: #dfe8e4;
      }
      .steps .number {
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        font-size: 24px;
        font-weight: 800;
        color: #04150d;
        background: linear-gradient(135deg, #25d366, #128c7e);
      }
      .steps .muted {
        color: #93a8a1;
        font-weight: 500;
      }
      .shot {
        position: absolute;
        right: 72px;
        top: 122px;
        width: 492px;
        height: 322px;
        background: #0c1d18;
        overflow: hidden;
        border-radius: 22px;
        box-shadow:
          0 30px 80px rgba(0, 0, 0, 0.6),
          0 0 0 1px rgba(255, 255, 255, 0.08);
      }
      /* The capture is 520 x 560; this crop keeps only the form card, edge to edge. */
      .shot img {
        position: absolute;
        display: block;
        width: 580px;
        left: -44px;
        top: -268px;
      }
      .chat {
        position: absolute;
        right: 72px;
        top: 478px;
        width: 492px;
        border-radius: 22px;
        overflow: hidden;
        background: #0b1f1a;
        box-shadow:
          0 30px 80px rgba(0, 0, 0, 0.6),
          0 0 0 1px rgba(255, 255, 255, 0.08);
      }
      .chat-head {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 16px 20px;
        background: #12201c;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .avatar {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: #2a3b36;
        display: grid;
        place-items: center;
        color: #93a8a1;
      }
      .avatar svg {
        width: 24px;
        height: 24px;
      }
      .chat-name {
        font-size: 21px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .chat-status {
        font-size: 15px;
        color: #93a8a1;
      }
      .chat-body {
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .bubble {
        max-width: 78%;
        padding: 12px 16px;
        border-radius: 16px;
        font-size: 20px;
        line-height: 1.3;
      }
      .bubble.sent {
        align-self: flex-end;
        background: #1f6f4a;
        border-bottom-right-radius: 4px;
      }
      .bubble.received {
        align-self: flex-start;
        background: #22322d;
        border-bottom-left-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="caption">
      <div class="brand">WhatsApp Without Saving a Contact</div>
      <h1>Message any number, <span class="accent">save no contact.</span></h1>
      <ol class="steps">
        <li><span class="number">1</span><span>Type the number</span></li>
        <li><span class="number">2</span><span>Press <span class="accent">Open chat</span></span></li>
        <li><span class="number">3</span><span>Chat, <span class="muted">no contact saved</span></span></li>
      </ol>
    </div>

    <div class="shot"><img src="screenshot.webp" alt="" /></div>

    <div class="chat">
      <div class="chat-head">
        <span class="avatar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21c0-4 4-6 8-6s8 2 8 6" />
          </svg>
        </span>
        <div>
          <div class="chat-name">+34 600 000 000</div>
          <div class="chat-status">Not in your contacts</div>
        </div>
      </div>
      <div class="chat-body">
        <div class="bubble sent">Hi! Is the flat still for rent?</div>
        <div class="bubble received">Yes, come see it on Friday.</div>
      </div>
    </div>
  </body>
</html>
