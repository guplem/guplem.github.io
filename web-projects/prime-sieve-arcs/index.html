<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="An animation of the Sieve of Eratosthenes: every prime hops over its multiples in glowing arcs, and the numbers no arc lands on are the primes." />
  <title>Prime Sieve Arcs · The Sieve of Eratosthenes as glowing hops · Guillem Poy</title>
  <link rel="canonical" href="https://triunitystudios.com/web-projects/prime-sieve-arcs/" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23050505'/%3E%3Cg fill='none' stroke='%23eeb04a' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M4 24a4 4 0 0 1 8 0a4 4 0 0 1 8 0a4 4 0 0 1 8 0'/%3E%3Cpath d='M4 24a12 12 0 0 1 24 0' stroke='%23e69b29' opacity='.6'/%3E%3C/g%3E%3Ccircle cx='4' cy='24' r='1.6' fill='%23f3f5f9'/%3E%3Ccircle cx='28' cy='24' r='1.6' fill='%23f3f5f9'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="overlay">
    <header id="caption">
      <h1>Prime Sieve Arcs</h1>
      <p>Every prime hops over its multiples. A number that no hop lands on is prime.</p>
    </header>

    <div id="hud">
      <span><b id="hud-number">0</b> reached</span>
      <span><b id="hud-count">0</b> primes</span>
      <span>last <b id="hud-latest">--</b></span>
    </div>

    <div id="controls">
      <button id="play" type="button" aria-label="Pause the animation">Pause</button>
      <button id="restart" type="button" aria-label="Restart the animation">Restart</button>

      <label class="dial" for="speed-input" title="How many numbers the scanner walks each second">
        <span class="dial-name">speed</span>
        <input id="speed-input" type="range" min="0.25" max="8" step="0.25">
        <output id="speed-value" for="speed-input">2</output>
      </label>

      <label class="dial" for="limit-input" title="How far the sweep counts. The picture ends up about twice as wide as this.">
        <span class="dial-name">count to</span>
        <input id="limit-input" type="range" min="20" max="250" step="5">
        <output id="limit-value" for="limit-input">50</output>
      </label>

      <span id="hint">space to pause &middot; R to restart</span>
    </div>
  </div>

  <script src="render.js" type="module"></script>
</body>
</html>
