<!doctype html>
<!--
  Source of the portfolio image resources/images/projects/terrainPrint.webp.
  Re-render it with:
    bun scripts/captureProjectImage.js --page resources/images/projects/sources/terrainPrint/ --out resources/images/projects/terrainPrint.webp --width 1280 --height 800 --quality 80
  screenshot.webp comes from the page itself: Tenerife as a 16-piece puzzle in a frame, with the sea and a snow line.
    bun scripts/captureProjectImage.js --page "web-projects/terrain-print/?b=earth&lat=28.27&lon=-16.64&km=95&split=puzzle&pieces=16&frame=tray&snow=1&snowm=2500&view=model" --out resources/images/projects/sources/terrainPrint/screenshot.webp --width 1240 --height 700 --wait 25000 --quality 85
  The page needs the network (height tiles and three.js), and about 20 s to build the model.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Terrain Print portfolio image</title>
    <style>
      @font-face {
        font-family: "Inter";
        src: url("../../../../fonts/InterVariable.woff2") format("woff2");
        font-weight: 100 900;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1280px;
        height: 800px;
        overflow: hidden;
      }
      body {
        position: relative;
        font-family: "Inter", "Segoe UI", sans-serif;
        color: #eef3fa;
        background:
          radial-gradient(circle at 88% 6%, rgba(79, 155, 232, 0.3), transparent 42%),
          radial-gradient(circle at 6% 100%, rgba(185, 184, 177, 0.16), transparent 40%),
          #070c16;
      }
      .caption {
        position: absolute;
        left: 110px;
        right: 110px;
        top: 50px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 20px;
        font-weight: 600;
        color: #9fb0c6;
      }
      .brand::before {
        content: "";
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #b9b8b1;
        box-shadow: 0 0 0 5px rgba(79, 155, 232, 0.35);
      }
      h1 {
        margin-top: 16px;
        font-size: 56px;
        line-height: 1.05;
        font-weight: 800;
        letter-spacing: -1.5px;
      }
      .accent {
        color: #6cb0f5;
      }
      .sub {
        margin-top: 14px;
        font-size: 22px;
        color: #a9b6c8;
      }
      .shot {
        position: absolute;
        left: 50%;
        bottom: 0;
        width: 880px;
        height: 520px;
        transform: translateX(-50%);
        overflow: hidden;
        border-radius: 14px 14px 0 0;
        box-shadow:
          0 30px 80px rgba(0, 0, 0, 0.6),
          0 0 0 1px rgba(255, 255, 255, 0.08);
      }
      /* Only the 3D stage: the screenshot is 1240 px wide and the panel takes
         its first 340 px. At 0.977 scale the 900 px stage fills 880 px, and
         the frame tray (rows 115 to 650) fills the 520 px height. */
      .shot img {
        display: block;
        width: 1212px;
        margin-left: -332px;
        margin-top: -112px;
      }
    </style>
  </head>
  <body>
    <div class="caption">
      <div class="brand">Terrain Print · Moon, Mars and Earth</div>
      <h1>Print the Moon, Mars <span class="accent">or Earth.</span></h1>
      <p class="sub">Real height data, as one tile, bed-sized pieces or a jigsaw puzzle.</p>
    </div>
    <div class="shot"><img src="screenshot.webp" alt="" /></div>
  </body>
</html>
