<!doctype html>
<!--
  Source of the portfolio image resources/images/projects/pskill.webp.
  Re-render it with:
    bun scripts/captureProjectImage.js --page resources/images/projects/sources/pskill/ --out resources/images/projects/pskill.webp --width 1280 --height 800 --quality 80
  screenshot.webp is docs/viewer-implement-issue.png from github.com/guplem/pskill
  (the example skill implement-issue in the viewer), scaled to 1600 px wide with:
    ffmpeg -i viewer-implement-issue.png -vf scale=1600:-1 -quality 85 screenshot.webp
  The frame below shows its top part: the graph and the panel of one step.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>pskill portfolio image</title>
    <style>
      @font-face {
        font-family: "Inter";
        src: url("../../../../fonts/InterVariable.woff2") format("woff2");
        font-weight: 100 900;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1280px;
        height: 800px;
        overflow: hidden;
      }
      body {
        position: relative;
        font-family: "Inter", "Segoe UI", sans-serif;
        color: #f4f4f5;
        background:
          radial-gradient(circle at 92% 6%, rgba(60, 205, 181, 0.28), transparent 42%),
          radial-gradient(circle at 4% 100%, rgba(60, 205, 181, 0.14), transparent 42%),
          #18181b;
      }
      .caption {
        position: absolute;
        left: 90px;
        right: 90px;
        top: 48px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 20px;
        font-weight: 600;
        color: #a1a1aa;
      }
      .brand::before {
        content: "";
        width: 14px;
        height: 14px;
        border-radius: 4px;
        background: #3ccdb5;
        box-shadow: 0 0 0 5px rgba(60, 205, 181, 0.3);
      }
      h1 {
        margin-top: 16px;
        font-size: 58px;
        line-height: 1.05;
        font-weight: 800;
        letter-spacing: -1.5px;
      }
      .accent {
        color: #3ccdb5;
      }
      .sub {
        margin-top: 12px;
        font-size: 22px;
        color: #a1a1aa;
      }
      /* The screenshot is 1600 px wide; the frame shows it at 1100 px. */
      .shot {
        position: absolute;
        left: 50%;
        bottom: 0;
        width: 1100px;
        height: 548px;
        transform: translateX(-50%);
        overflow: hidden;
        border-radius: 14px 14px 0 0;
        background: #ffffff url("screenshot.webp") 0 0 / 1100px auto no-repeat;
        box-shadow:
          0 30px 80px rgba(0, 0, 0, 0.6),
          0 0 0 1px rgba(255, 255, 255, 0.08);
      }
    </style>
  </head>
  <body>
    <div class="caption">
      <div class="brand">pskill · for Claude Code, Codex and more</div>
      <h1>Agent skills as <span class="accent">programs</span>, not long text</h1>
      <p class="sub">A typed graph of steps. The agent gets one step at a time, and cannot skip any.</p>
    </div>
    <div class="shot" role="img" aria-label="The implement-issue skill drawn as a graph in the pskill viewer"></div>
  </body>
