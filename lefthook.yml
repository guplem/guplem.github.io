# Local pre-commit automation (optional convenience). Install once:
#   winget install evilmartians.lefthook   (or: brew install lefthook)
#   lefthook install
#
# The real enforcement is CI: the drift tests in scripts/*.test.js fail
# whenever the committed generated artifacts do not match the data, so a
# commit made without this hook (or with --no-verify) cannot merge stale
# output. See root ADR 0010.

pre-commit:
  parallel: true
  commands:
    # Regenerate the crawler-facing derived files (sitemap.xml, blog/feed.xml
    # and the static blocks in index.html / web-projects/index.html /
    # blog/index.html) whenever the source data, a blog post or the generators
    # change, and stage the results.
    seo-content-sync:
      glob:
        - "data/info.json"
        - "data/projects/*.json"
        - "blog/*/index.html"
        - "scripts/*.js"
        # Modules the generators import; changing them can change the output.
        - "js/utils/textCore.js"
        - "web-projects/discovery.js"
      run: bun scripts/generateSitemap.js && bun scripts/generateSeoBlocks.js && bun scripts/generateFeed.js && git add sitemap.xml index.html web-projects/index.html blog/index.html blog/feed.xml
