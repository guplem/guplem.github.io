<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#eef0f5" media="(prefers-color-scheme: light)" />

      name="description"
      content="Turn a photo into a WhatsApp sticker. Automatic background removal you can paint over, cropping, filters, captions and animated frames, all held to WhatsApp's own sticker rules. Everything happens on your device, in English or Spanish."
    />
    <title>Sticker Studio · WhatsApp Stickers From Your Own Photos · Guillem Poy</title>
    <link rel="canonical" href="https://triunitystudios.com/web-projects/whatsapp-sticker-creator/" />

  </head>
  <body>
    <div class="page">
      <header class="masthead">
        <h1 id="title">Sticker Studio for WhatsApp</h1>
        <p class="tagline" id="tagline"></p>
        <div class="lang" id="lang-picker" role="group" aria-label="Language"></div>
      </header>

      <main>
        <p class="banner" id="banner" hidden role="alert"></p>

        <!-- 1. Pick a picture -->
        <section class="panel" id="pick-panel" aria-labelledby="pick-heading">
          <h2 id="pick-heading"></h2>
          <div class="dropzone" id="dropzone">
            <p class="dropzone-line" id="pick-drop"></p>
            <button type="button" class="button primary" id="pick-button"></button>
            <p class="hint" id="pick-hint"></p>
          </div>
          <input type="file" id="file-input" accept="image/*" multiple hidden />
        </section>

        <!-- 2. Make the sticker -->
        <section class="panel" id="editor-panel" aria-labelledby="edit-heading" hidden>
          <h2 id="edit-heading"></h2>

          <div class="stage">
            <div class="canvas-wrap" id="canvas-wrap">
              <canvas id="preview" width="512" height="512"></canvas>
              <canvas id="overlay" width="512" height="512"></canvas>
            </div>
            <div class="stage-side">
              <p class="status" id="status" aria-live="polite"></p>
              <button type="button" class="button ghost small" id="pick-another"></button>
            </div>
          </div>

          <div class="tools">
          <div class="tabs" id="tool-tabs" role="tablist"></div>

          <!-- Cut out -->
          <div class="tool" id="tool-cutout" role="tabpanel">
            <button type="button" class="button primary" id="cutout-auto"></button>
            <p class="hint" id="cutout-auto-hint"></p>

            <label class="field">
              <span class="field-label"
                ><span id="cutout-tolerance-label"></span>
                <output id="cutout-tolerance-out"></output
              ></span>
              <input type="range" id="cutout-tolerance" min="2" max="40" step="1" value="12" />
              <span class="hint" id="cutout-tolerance-hint"></span>
            </label>

            <label class="field">
              <span class="field-label"
                ><span id="cutout-edge-label"></span>
                <output id="cutout-edge-out"></output
              ></span>
              <input type="range" id="cutout-edge" min="5" max="80" step="1" value="30" />
              <span class="hint" id="cutout-edge-hint"></span>
            </label>

            <label class="field">
              <span class="field-label"
                ><span id="cutout-feather-label"></span>
                <output id="cutout-feather-out"></output
              ></span>
              <input type="range" id="cutout-feather" min="0" max="6" step="1" value="1" />
            </label>

            <button type="button" class="button ghost" id="cutout-refine"></button>
            <p class="hint" id="cutout-refine-hint"></p>

            <div class="segmented" id="cutout-modes" role="group"></div>

            <label class="field">
              <span class="field-label"
                ><span id="cutout-brush-label"></span>
                <output id="cutout-brush-out"></output
              ></span>
              <input type="range" id="cutout-brush" min="4" max="160" step="2" value="40" />
            </label>

            <label class="field">
              <span class="field-label"
                ><span id="cutout-softness-label"></span>
                <output id="cutout-softness-out"></output
              ></span>
              <input type="range" id="cutout-softness" min="0" max="100" step="5" value="60" />
            </label>

            <p class="hint" id="cutout-mode-hint"></p>

            <div class="row">
              <button type="button" class="button ghost small" id="cutout-undo"></button>
              <button type="button" class="button ghost small" id="cutout-redo"></button>
              <button type="button" class="button ghost small" id="cutout-reset"></button>
            </div>
          </div>

          <!-- Frame -->
          <div class="tool" id="tool-crop" role="tabpanel" hidden>
            <div class="row">
              <button type="button" class="button primary" id="crop-fit-content"></button>
              <button type="button" class="button ghost" id="crop-fit-whole"></button>
              <button type="button" class="button ghost" id="crop-fill"></button>
            </div>
            <p class="hint" id="crop-fit-hint"></p>

            <label class="field">
              <span class="field-label"
                ><span id="crop-padding-label"></span>
                <output id="crop-padding-out"></output
              ></span>
              <input type="range" id="crop-padding" min="0" max="96" step="2" value="16" />
              <span class="hint" id="crop-padding-hint"></span>
            </label>

            <label class="field">
              <span class="field-label"
                ><span id="crop-zoom-label"></span>
                <output id="crop-zoom-out"></output
              ></span>
              <input type="range" id="crop-zoom" min="40" max="300" step="1" value="100" />
            </label>

            <div class="row">
              <button type="button" class="button ghost small" id="crop-flip"></button>
              <button type="button" class="button ghost small" id="crop-rotate"></button>
            </div>
          </div>

          <!-- Colour -->
          <div class="tool" id="tool-colour" role="tabpanel" hidden>
            <div class="chips" id="colour-presets" role="group"></div>

            <label class="field">
              <span class="field-label"
                ><span id="colour-brightness-label"></span>
                <output id="colour-brightness-out"></output
              ></span>
              <input type="range" id="colour-brightness" min="-50" max="50" step="1" value="0" />
            </label>
            <label class="field">
              <span class="field-label"
                ><span id="colour-contrast-label"></span>
                <output id="colour-contrast-out"></output
              ></span>
              <input type="range" id="colour-contrast" min="50" max="200" step="1" value="100" />
            </label>
            <label class="field">
              <span class="field-label"
                ><span id="colour-saturation-label"></span>
                <output id="colour-saturation-out"></output
              ></span>
              <input type="range" id="colour-saturation" min="0" max="200" step="1" value="100" />
            </label>
            <label class="field">
              <span class="field-label"
                ><span id="colour-temperature-label"></span>
                <output id="colour-temperature-out"></output
              ></span>
              <input type="range" id="colour-temperature" min="-100" max="100" step="1" value="0" />
            </label>
            <button type="button" class="button ghost small" id="colour-reset"></button>
          </div>

          <!-- Text -->
          <div class="tool" id="tool-text" role="tabpanel" hidden>
            <button type="button" class="button primary" id="text-add"></button>
            <p class="hint" id="text-drag-hint"></p>
            <p class="empty" id="text-empty"></p>
            <div class="layers" id="text-list"></div>
          </div>

          <!-- Animate -->
          <div class="tool" id="tool-frames" role="tabpanel" hidden>
            <button type="button" class="button primary" id="frames-add"></button>
            <p class="hint" id="frames-add-hint"></p>
            <input type="file" id="frames-file" accept="image/*" multiple hidden />

            <p class="count" id="frames-count"></p>
            <div class="strip" id="frames-strip"></div>
            <p class="hint" id="frames-first-hint"></p>

            <label class="field">
              <span class="field-label"
                ><span id="frames-duration-label"></span>
                <output id="frames-duration-out"></output
              ></span>
              <input type="range" id="frames-duration" min="8" max="1000" step="1" value="100" />
            </label>
            <button type="button" class="button ghost small" id="frames-same-all"></button>

            <label class="field">
              <span class="field-label"
                ><span id="frames-speed-label"></span>
                <output id="frames-speed-out"></output
              ></span>
              <input type="range" id="frames-speed" min="25" max="400" step="5" value="100" />
            </label>

            <div class="row">
              <button type="button" class="button ghost small" id="frames-play"></button>
              <label class="check"
                ><input type="checkbox" id="frames-pingpong" />
                <span id="frames-pingpong-label"></span
              ></label>
            </div>
            <p class="count" id="frames-total"></p>
            <p class="hint" id="frames-single"></p>
          </div>

          <!-- Finish -->
          <div class="tool" id="tool-finish" role="tabpanel" hidden>
            <label class="check"
              ><input type="checkbox" id="finish-outline" />
              <span id="finish-outline-label"></span
            ></label>
            <p class="hint" id="finish-outline-hint"></p>

            <label class="field">
              <span class="field-label"
                ><span id="finish-width-label"></span>
                <output id="finish-width-out"></output
              ></span>
              <input type="range" id="finish-outline-width" min="0" max="24" step="1" value="8" />
            </label>
            <label class="field inline">
              <span class="field-label" id="finish-colour-label"></span>
              <input type="color" id="finish-outline-colour" value="#ffffff" />
            </label>
            <p class="count" id="finish-size"></p>
          </div>
          </div>
        </section>

        <!-- 3. Tag it -->
        <section class="panel" id="details-panel" aria-labelledby="details-heading" hidden>
          <h2 id="details-heading"></h2>

          <label class="field">
            <span class="field-label"
              ><span id="emoji-label"></span> <output id="emoji-count"></output
            ></span>
            <input type="text" id="emoji-input" inputmode="text" autocomplete="off" />
            <span class="hint" id="emoji-hint"></span>
          </label>
          <div class="chips" id="emoji-suggest" role="group"></div>

          <label class="field">
            <span class="field-label"
              ><span id="a11y-label"></span> <output id="a11y-count"></output
            ></span>
            <textarea id="a11y-input" rows="2"></textarea>
            <span class="hint" id="a11y-hint"></span>
          </label>
        </section>

        <!-- 4. Check it -->
        <section class="panel" id="check-panel" aria-labelledby="check-heading" hidden>
          <h2 id="check-heading"></h2>
          <p class="check-summary" id="check-summary" aria-live="polite"></p>
          <ul class="findings" id="check-list"></ul>
          <details class="rules">
            <summary id="rules-summary"></summary>
            <ul id="rules-list"></ul>
          </details>
        </section>

        <!-- 5. Build a pack -->
        <section class="panel" id="pack-panel" aria-labelledby="pack-heading" hidden>
          <h2 id="pack-heading"></h2>

          <button type="button" class="button primary" id="pack-add"></button>

          <div class="pack-meta">
            <label class="field">
              <span class="field-label" id="pack-name-label"></span>
              <input type="text" id="pack-name" maxlength="128" autocomplete="off" />
            </label>
            <label class="field">
              <span class="field-label" id="pack-publisher-label"></span>
              <input type="text" id="pack-publisher" maxlength="128" autocomplete="off" />
            </label>
            <label class="field">
              <span class="field-label" id="pack-identifier-label"></span>
              <input type="text" id="pack-identifier" maxlength="128" autocomplete="off" />
              <span class="hint" id="pack-identifier-hint"></span>
            </label>
          </div>

          <p class="count">
            <span id="pack-count"></span> <span class="badge" id="pack-kind"></span>
          </p>
          <p class="empty" id="pack-empty"></p>
          <div class="pack-grid" id="pack-grid"></div>

          <div class="row exports">
            <button type="button" class="button primary" id="export-sticker"></button>
            <button type="button" class="button" id="export-wastickers"></button>
            <button type="button" class="button ghost" id="export-contents"></button>
          </div>
          <p class="hint" id="export-wastickers-hint"></p>
          <p class="hint" id="export-contents-hint"></p>

          <details class="rules">
            <summary id="howto-summary"></summary>
            <p id="howto-body"></p>
          </details>

          <button type="button" class="button ghost small danger" id="pack-clear"></button>
        </section>
      </main>

      <footer class="footer">
        <p class="privacy" id="privacy"></p>
        <p class="deploy-line" id="deploy-line"></p>
        <p><a class="back-link" id="back-link" href="../">All web projects</a></p>
      </footer>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
