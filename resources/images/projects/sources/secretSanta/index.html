<!doctype html>
<!--
  Source of the portfolio image resources/images/projects/secretSanta.webp.
  Re-render it with:
    bun scripts/captureProjectImage.js --page resources/images/projects/sources/secretSanta/ --out resources/images/projects/secretSanta.webp --width 1280 --height 800 --quality 80
  The two phone screenshots come from the page itself, with a fixed event in the URL (fictional names, seed "snowfall"):
    bun scripts/captureProjectImage.js --page "web-projects/secret-santa/?draft=eyJ2IjoxLCJ0IjoiQ2hyaXN0bWFzIDIwMjYiLCJuIjpbIkFubmEiLCJCZXJuYXQiLCJDYXJsYSIsIkRhdmlkIiwiRWxlbmEiLCJGZXJyYW4iXSwieCI6W1swLDFdLFsxLDBdLFszLDRdLFs0LDNdXSwicyI6Ii0ifQ" --out resources/images/projects/sources/secretSanta/create.webp --width 400 --height 860 --quality 85
    bun scripts/captureProjectImage.js --page "web-projects/secret-santa/?e=eyJ2IjoxLCJ0IjoiQ2hyaXN0bWFzIDIwMjYiLCJuIjpbIkFubmEiLCJCZXJuYXQiLCJDYXJsYSIsIkRhdmlkIiwiRWxlbmEiLCJGZXJyYW4iXSwieCI6W1swLDFdLFsxLDBdLFszLDRdLFs0LDNdXSwicyI6InNub3dmYWxsIn0" --out resources/images/projects/sources/secretSanta/reveal.webp --click "Anna" --click "Yes, I am Anna" --click "Open the present" --width 400 --height 860 --quality 85
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Secret Santa portfolio image</title>
    <style>
      @font-face {
        font-family: "Inter";
        src: url("../../../../fonts/InterVariable.woff2") format("woff2");
        font-weight: 100 900;
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1280px; height: 800px; overflow: hidden; }
      body {
        position: relative;
        font-family: "Inter", "Segoe UI", sans-serif;
        color: #f8f1ff;
        background:
          radial-gradient(circle at 85% 10%, rgba(255, 77, 109, 0.35), transparent 45%),
          radial-gradient(circle at 5% 100%, rgba(28, 75, 92, 0.6), transparent 50%),
          #140b1f;
      }
      .caption { position: absolute; left: 90px; top: 0; bottom: 0; width: 520px; display: flex; flex-direction: column; justify-content: center; }
      .brand { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 600; color: #b9a9cc; }
      h1 { margin-top: 20px; font-size: 68px; line-height: 1.04; font-weight: 800; letter-spacing: -1.5px; }
      .accent { background: linear-gradient(90deg, #ffc94d, #ff8a5c); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .sub { margin-top: 20px; font-size: 25px; line-height: 1.4; color: #d6c9e6; }
      .phone {
        position: absolute;
        width: 330px;
        height: 710px;
        overflow: hidden;
        border-radius: 34px;
        border: 6px solid #2c1d40;
        box-shadow: 0 40px 90px rgba(0, 0, 0, 0.55);
      }
      .phone img { display: block; width: 100%; }
      .one { left: 640px; top: 70px; transform: rotate(-4deg); }
      .two { left: 900px; top: 40px; transform: rotate(4deg); }
    </style>
  </head>
  <body>
    <div class="caption">
      <div class="brand">🎁 Secret Santa</div>
      <h1>One link. <span class="accent">Everyone opens their own surprise.</span></h1>
      <p class="sub">List the people, tap who can't give to whom, share. Each person sees only their match.</p>
    </div>
    <div class="phone one"><img src="create.webp" alt="" /></div>
    <div class="phone two"><img src="reveal.webp" alt="" /></div>
  </body>
</html>
