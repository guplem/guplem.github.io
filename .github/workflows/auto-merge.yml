name: Auto-merge PRs

# Vibe-coding flow: PRs are not reviewed by a human. This workflow flags every
# non-draft PR for GitHub's native auto-merge, so it merges itself the moment
# the required checks pass. Auto-merge only completes once the "Requirements
# for merge" ruleset on `main` is satisfied, so the real safety net is the
# required `test` check (see test.yml and AGENTS.md), NOT this workflow.
#
# The ruleset includes a `pull_request` rule with required_approving_review_count: 0.
# It forces every change through a PR and blocks direct pushes to `main`, but
# requires no approval. A real approval count would make auto-merge wait forever.
#
# Plain GITHUB_TOKEN is enough here. The site is published by classic GitHub
# Pages (deploy from the `main` branch), which is a built-in service, not a
# `push`-triggered workflow, so it republishes on the merge push regardless of
# which token made it. (A GitHub App token is only needed when a `push`-based
# deploy WORKFLOW must fire on the merge, because GitHub does not trigger
# workflows from a GITHUB_TOKEN push.)

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]

# Only the auto-merge queueing needs write; nothing else here mutates the repo.
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Only auto-merge our own branches, never fork PRs. Skip drafts too: a draft
    # PR is explicitly "not ready", so don't queue it. The same-repo check keeps
    # outside contributors' fork PRs (this repo is public) out of auto-merge --
    # they still run CI but must be merged by hand.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Enable auto-merge (merge commit)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR_URL"
