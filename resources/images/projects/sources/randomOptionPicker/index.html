<!doctype html>
<!--
  Source of the portfolio image resources/images/projects/randomOptionPicker.webp.
  Re-render it with:
    bun scripts/captureProjectImage.js --page resources/images/projects/sources/randomOptionPicker/ --out resources/images/projects/randomOptionPicker.webp --width 1280 --height 800 --quality 80
  screenshot.webp comes from the page itself; the seed in the link pins the draw, so a re-capture gives the same picks:
    bun scripts/captureProjectImage.js --page "web-projects/random-option-picker/?o=Pizza&o=Sushi&o=Tacos&o=Ramen&o=Burgers&o=Curry&n=2&s=friday" --out resources/images/projects/sources/randomOptionPicker/screenshot.webp --click "Pick" --width 1000 --height 900 --wait 4000 --quality 85
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Random Option Picker portfolio image</title>
    <style>
      @font-face {
        font-family: "Inter";
        src: url("../../../../fonts/InterVariable.woff2") format("woff2");
        font-weight: 100 900;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1280px;
        height: 800px;
        overflow: hidden;
      }
      body {
        position: relative;
        font-family: "Inter", "Segoe UI", sans-serif;
        color: #f5f5f7;
        background:
          radial-gradient(circle at 12% 6%, rgba(124, 92, 255, 0.32), transparent 42%),
          radial-gradient(circle at 96% 100%, rgba(155, 133, 255, 0.2), transparent 45%),
          #0a0e1a;
      }
      .caption {
        position: absolute;
        left: 80px;
        width: 440px;
        top: 50%;
        transform: translateY(-50%);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 20px;
        font-weight: 600;
        color: #94a3b8;
      }
      .brand::before {
        content: "";
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #7c5cff;
        box-shadow: 0 0 0 5px rgba(124, 92, 255, 0.3);
      }
      h1 {
        margin-top: 20px;
        font-size: 70px;
        line-height: 1.02;
        font-weight: 800;
        letter-spacing: -2px;
      }
      .accent {
        color: #9b85ff;
      }
      .sub {
        margin-top: 22px;
        font-size: 24px;
        line-height: 1.4;
        color: #b4bfd0;
      }
      .shot {
        position: absolute;
        left: 545px;
        top: 72px;
        width: 700px;
        height: 728px;
        overflow: hidden;
        border-radius: 16px 16px 0 0;
        box-shadow:
          0 30px 80px rgba(0, 0, 0, 0.6),
          0 0 0 1px rgba(255, 255, 255, 0.1);
      }
      .shot img {
        display: block;
        width: 1000px;
        margin-left: -150px;
        margin-top: -158px;
      }
    </style>
  </head>
  <body>
    <div class="caption">
      <div class="brand">Random Option Picker</div>
      <h1>Same link, <span class="accent">same pick.</span></h1>
      <p class="sub">Draw at random from any list. A seed in the link replays the exact draw.</p>
    </div>
    <div class="shot"><img src="screenshot.webp" alt="" /></div>
  </body>
</html>
