<body>
  <a class="skip-link" href="#story-list">Skip to the list of stories</a>

  <div class="page">
    <header class="masthead">
      <div class="masthead-text">
        <h1 id="title">Global News Map</h1>
        <p class="tagline" id="tagline">The day's news, pinned where it happened.</p>
      </div>
    </header>

    <main>
      <!-- The day and the map. On a phone this block holds the top of the screen
           and never scrolls, so the map stays in sight while the list moves.
           Collapsed, this whole block becomes one card: the day bar moves inside
           it beside the small map, so the fold gives its room to the list and
           not to a second row of date buttons. `data-collapsed` is set here, on
           the block that holds both. -->
      <div class="stage" id="stage">
        <!-- The day being shown. The buttons and the date box are the same state,
             which also lives in the address bar. -->
        <nav class="daybar" aria-label="Choose a day">
          <button type="button" id="prev-day" class="icon-button" aria-label="Previous day">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7" /></svg>
          </button>
          <label class="day-field">
            <span class="visually-hidden" id="day-label">Choose a day</span>
            <input type="date" id="day-input" aria-labelledby="day-label" />
          </label>
          <button type="button" id="next-day" class="icon-button" aria-label="Next day">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 5l7 7-7 7" /></svg>
          </button>
          <button type="button" id="latest-day" class="text-button">Latest</button>
        </nav>

        <div class="map-wrap">
          <!-- Shrinks the map to a bar, which gives most of the screen to the
               words for a reader who is reading more than they are looking.
               There is no button the other way: the small map itself expands,
               and its room in the collapsed card goes to the day bar.

               It shows the "make this smaller" icon and no words, so it takes a
               corner of the map and never a strip of it. `app.js` keeps its name
               in `aria-label`, which is how a screen reader hears it. -->
          <button type="button" id="toggle-map" class="map-toggle" aria-controls="map" aria-expanded="true" aria-label="Collapse map">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 3v3a2 2 0 0 1-2 2H3" /><path d="M21 8h-3a2 2 0 0 1-2-2V3" /><path d="M3 16h3a2 2 0 0 1 2 2v3" /><path d="M16 21v-3a2 2 0 0 1 2-2h3" /></svg>
          </button>

          <!-- The map itself. Full size it is a picture of the story list below,
               so the canvas is marked as an image and the list carries the real
               content for a screen reader and for a search engine. Collapsed it
               is the one control that brings the big map back, so `app.js`
               marks it as a button for as long as it is small. -->
          <canvas id="map" role="img" aria-label="World map of the day's news"></canvas>

          <div class="map-controls">
            <button type="button" id="zoom-in" class="icon-button" aria-label="Zoom in">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 6v12M6 12h12" /></svg>
            </button>
            <button type="button" id="zoom-out" class="icon-button" aria-label="Zoom out">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 12h12" /></svg>
            </button>
            <button type="button" id="reset-view" class="icon-button" aria-label="Whole world">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8" /><path d="M4 12h16M12 4c3.5 4 3.5 12 0 16M12 4c-3.5 4-3.5 12 0 16" /></svg>
            </button>
          </div>

          <p class="status" id="status" role="status" aria-live="polite">Reading the day's news…</p>

          <!-- The way to the other places on the chosen pin, on a phone, which
               has no panel to say that they are there. It floats over the map so
               that it costs no height: the reader scrolling the list makes it
               come and go, and a box in the layout would move the list under
               them every time. -->
          <button type="button" id="next-place" class="next-place" hidden></button>
        </div>
      </div>

      <!-- The reading column. It sits beside the map on a wide screen and under
           it on a phone, where it is the only part that scrolls. The open story
           is never drawn over the map, so the pins it is being compared against
           stay visible. -->
      <div class="side" id="reading">
        <!-- Every story at the chosen location, in full. A marker reading "5"
             fills this with five stories, so the whole place can be read in one
             go without hunting for its stories in the day's full list below. -->
        <aside class="selected" id="selected-panel" hidden aria-labelledby="selected-heading">
          <div class="selected-head">
            <div class="selected-titles">
              <p class="selected-label" id="selected-label"></p>
              <h2 class="selected-heading" id="selected-heading"></h2>
              <p class="selected-count" id="selected-count"></p>
              <!-- Said only when the chosen marker also covers other places. -->
              <p class="selected-note" id="selected-note" hidden></p>
            </div>
            <button type="button" id="selected-close" class="icon-button selected-close" aria-label="Close">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 6 12 12M18 6 6 18" /></svg>
            </button>
          </div>
          <div class="selected-stories" id="selected-stories"></div>
        </aside>

        <section class="list" id="story-list" aria-labelledby="story-list-heading">
          <h2 class="section-heading" id="story-list-heading">All the day's stories</h2>
          <p class="hint" id="list-hint">Pick a pin to read a story.</p>
          <ul class="stories" id="stories"></ul>

          <h2 class="section-heading" id="unplaced-heading" hidden>Named no place</h2>
          <p class="hint" id="unplaced-why" hidden></p>
          <ul class="stories stories-quiet" id="unplaced"></ul>
        </section>

        <!-- The footer ends the reading column, and on a phone it is also the
             room the list needs: the last story can only reach the top of the
             screen when something below it can still scroll. -->
        <footer class="footer">
          <p class="credit" id="credit-wikipedia"></p>
          <p class="credit" id="credit-coastlines"></p>
          <p class="credit" id="credit-privacy"></p>
          <p id="deploy-line" class="deploy-line"></p>
          <p><a class="back-link" id="back-link" href="../">All web projects</a></p>
        </footer>
      </div>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
