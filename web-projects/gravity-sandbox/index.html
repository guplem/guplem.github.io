<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="Interactive N-body gravity simulation: spawn bodies with slingshot throws, watch them merge, leave trails, and explore orbital presets." />
  <title>Gravity Sandbox · Interactive N-Body Simulation · Guillem Poy</title>
  <link rel="canonical" href="https://triunitystudios.com/web-projects/gravity-sandbox/" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2306060f'/%3E%3Cellipse cx='16' cy='16' rx='12' ry='6' fill='none' stroke='%236699ff' stroke-width='1.6' transform='rotate(-25 16 16)'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%23e0e8ff'/%3E%3Ccircle cx='26' cy='11.5' r='2.4' fill='%23c4a0ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="ui-overlay">
    <div id="top-bar">
      <h1>Gravity Sandbox</h1>
      <div id="controls">
        <button id="btn-clear" title="Clear all bodies">Clear</button>
        <button id="btn-pause" title="Pause / Resume">Pause</button>
        <button id="btn-trails" title="Toggle trails">Trails</button>
        <button id="btn-preset" title="Load a preset">Preset</button>
      </div>
    </div>

    <div id="mass-slider-container">
      <label for="mass-slider">Mass</label>
      <input type="range" id="mass-slider" min="1" max="100" value="20">
      <span id="mass-value">20</span>
    </div>

    <div id="hint">Tap to spawn &middot; Drag to launch</div>
    <div id="body-count"></div>
  </div>

  <script src="simulation.js" type="module"></script>
</body>
</html>
