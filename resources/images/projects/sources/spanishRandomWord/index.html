<!doctype html>
<!--
  Source of the portfolio image resources/images/projects/spanishRandomWord.webp.
  Re-render it with:
    bun scripts/captureProjectImage.js --page resources/images/projects/sources/spanishRandomWord/ --out resources/images/projects/spanishRandomWord.webp --width 1280 --height 800 --quality 80
  screenshot.webp comes from mock.html (the page with fixed values, because the
  definition comes from the Wiktionary API at run time):
    bun scripts/captureProjectImage.js --page resources/images/projects/sources/spanishRandomWord/mock.html --out resources/images/projects/sources/spanishRandomWord/screenshot.webp --width 900 --height 760 --quality 85 --wait 800
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Palabra al azar portfolio image</title>
    <style>
      @font-face {
        font-family: "Inter";
        src: url("../../../../fonts/InterVariable.woff2") format("woff2");
        font-weight: 100 900;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1280px;
        height: 800px;
        overflow: hidden;
      }
      body {
        position: relative;
        font-family: "Inter", "Segoe UI", sans-serif;
        color: #f5efe8;
        background:
          radial-gradient(circle at 88% 10%, rgba(251, 146, 60, 0.3), transparent 42%),
          radial-gradient(circle at 8% 100%, rgba(194, 65, 12, 0.25), transparent 45%),
          #16131a;
      }
      .caption {
        position: absolute;
        left: 110px;
        right: 110px;
        top: 52px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 20px;
        font-weight: 600;
        color: #c9bdb1;
      }
      .brand::before {
        content: "ñ";
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 8px;
        background: #c2410c;
        color: #fff;
        font-family: Georgia, serif;
        font-weight: 700;
      }
      h1 {
        margin-top: 18px;
        font-size: 58px;
        line-height: 1.05;
        font-weight: 800;
        letter-spacing: -1.5px;
      }
      .accent {
        color: #fb923c;
      }
      .sub {
        margin-top: 14px;
        font-size: 22px;
        color: #c9bdb1;
      }
      .shot {
        position: absolute;
        left: 50%;
        bottom: 0;
        width: 900px;
        height: 470px;
        transform: translateX(-50%);
        overflow: hidden;
        border-radius: 14px 14px 0 0;
        box-shadow:
          0 30px 80px rgba(0, 0, 0, 0.6),
          0 0 0 1px rgba(255, 255, 255, 0.08);
      }
      .shot img {
        display: block;
        width: 100%;
        margin-top: -100px;
      }
    </style>
  </head>
  <body>
    <div class="caption">
      <div class="brand">Palabra al azar · Spanish from Spain</div>
      <h1>A random Spanish word. <span class="accent">Do you know it?</span></h1>
      <p class="sub">Everyday words only. The meaning stays hidden until you ask for it.</p>
    </div>
    <div class="shot"><img src="screenshot.webp" alt="" /></div>
  </body>
</html>
